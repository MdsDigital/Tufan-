<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Task Pro | الحل المتكامل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="loading">

    <div id="loader" class="loader-screen">
        <div class="loader-core"></div>
    </div>

    <nav class="navbar" id="navbar">
        <div class="container nav-box">
            <div class="brand" onclick="Router.go('home')">
                <div class="logo-symbol">OT</div>
                <span>OmniTask <b>Pro</b></span>
            </div>
            <div class="nav-actions">
                <div class="nav-links">
                    <button onclick="Router.go('home')" class="active">الرئيسية</button>
                    <button onclick="Router.go('services')">الخدمات</button>
                    <button onclick="Router.go('portfolio')">الأعمال</button>
                </div>
                <div class="cart-trigger" onclick="Router.go('cart')">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-counter">0</span>
                </div>
            </div>
        </div>
    </nav>

    <main id="view-port">
        <section id="home" class="view active">
            <div class="hero-section">
                <div class="hero-badge">موثوق من قبل +2000 شركة</div>
                <h1>حول أعمالك إلى <br><span class="highlight">أنظمة ذكية</span></h1>
                <p>نحن لا نقدم مجرد خدمات، نحن نصمم حلولاً تكنولوجية ترفع من كفاءة مشروعك وتضاعف أرباحك.</p>
                <div class="hero-btns">
                    <button class="primary-btn" onclick="Router.go('services')">ابدأ الآن <i class="fa-solid fa-chevron-left"></i></button>
                    <button class="secondary-btn">استشارة مجانية</button>
                </div>
            </div>
        </section>

        <section id="services" class="view">
            <div class="container">
                <div class="header-v2">
                    <h2>استكشف تخصصاتنا</h2>
                    <div class="filter-pills" id="category-filter">
                        <button class="pill active" data-cat="all">الكل</button>
                        <button class="pill" data-cat="dev">برمجة</button>
                        <button class="pill" data-cat="design">تصميم</button>
                    </div>
                </div>
                <div id="services-render" class="services-grid-pro"></div>
            </div>
        </section>

        <section id="cart" class="view">
            <div class="container checkout-container">
                <div class="checkout-card">
                    <div class="cart-details">
                        <h3>سلة المشروعات</h3>
                        <div id="cart-list-pro"></div>
                        <div class="price-footer">
                            <span>الإجمالي التقديري</span>
                            <h2 id="grand-total">$0</h2>
                        </div>
                    </div>
                    <div class="contract-side">
                        <h3>نموذج التعاقد الذكي</h3>
                        <div class="form-group">
                            <label>الاسم الكامل</label>
                            <input type="text" id="user-name" placeholder="أدخل اسمك كما في الهوية">
                        </div>
                        <div class="signature-pad-container">
                            <canvas id="pad"></canvas>
                            <button class="clear-pad" onclick="Sign.clear()">مسح التوقيع</button>
                        </div>
                        <button class="submit-btn" onclick="Order.process()">
                            <i class="fa-brands fa-whatsapp"></i> توثيق وإرسال للتعميد
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="toast-wrapper"></div>

    <script src="script.js"></script>
</body>
</html>
