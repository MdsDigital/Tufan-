<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Task | Future of Services</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow"></div>

    <header class="header">
        <nav class="nav-container">
            <div class="brand" onclick="app.navigate('home')">
                <div class="brand-logo">O</div>
                <div class="brand-name">OMNI<span>TASK</span></div>
            </div>
            
            <ul class="nav-menu">
                <li onclick="app.navigate('home')"><i class="fas fa-home"></i></li>
                <li onclick="app.navigate('services')"><i class="fas fa-layer-group"></i></li>
                <li onclick="app.navigate('cart')"><i class="fas fa-shopping-bag"></i> <span id="cart-count">0</span></li>
            </ul>
        </nav>
    </header>

    <main id="app-root">
        <section id="home" class="page active">
            <div class="hero-glass">
                <h1>نصمم <span class="text-glow">المستقبل</span> بنقرة واحدة</h1>
                <p>المنصة الأولى التي تجمع بين ذكاء الآلة وإبداع البشر لتقديم خدمات نخبويّة.</p>
                <div class="cta-group">
                    <button class="btn-glow" onclick="app.navigate('services')">اكتشف الخدمات</button>
                    <button class="btn-outline" onclick="app.navigate('portfolio')">أعمالنا</button>
                </div>
            </div>
        </section>

        <section id="services" class="page">
            <div class="section-header">
                <h2>مصفوفة الخدمات</h2>
                <div class="filter-bar" id="filters"></div>
            </div>
            <div class="grid-layout" id="services-grid"></div>
        </section>

        <section id="cart" class="page">
            <div class="checkout-wrapper">
                <div class="glass-card cart-details">
                    <h3>حقيبة الطلبات</h3>
                    <div id="cart-items"></div>
                </div>
                <div class="glass-card checkout-action">
                    <h3>إتمام التعاقد</h3>
                    <div class="signature-area">
                        <canvas id="signature-pad"></canvas>
                        <div class="sig-tools">
                            <button onclick="app.clearSignature()">مسح</button>
                        </div>
                    </div>
                    <div class="price-summary">
                        <span>الإجمالي:</span>
                        <h2 id="total-price">$0</h2>
                    </div>
                    <button class="btn-glow full-width" onclick="app.confirmOrder()">
                        <i class="fab fa-whatsapp"></i> توقيع وإرسال للعميد
                    </button>
                </div>
            </div>
        </section>
    </main>

    <div id="notifications"></div>
    <script src="script.js"></script>
</body>
</html>
